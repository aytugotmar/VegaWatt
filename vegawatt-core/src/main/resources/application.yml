spring:
  application:
    name: vegawatt-core
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vegawatt}
    username: ${POSTGRES_USER:vegawatt}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: vegawatt-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

vegawatt:
  kafka:
    registration-topic: ${KAFKA_REGISTRATION_TOPIC:vegawatt.asset-registration.v1}
    telemetry-topic: ${KAFKA_TELEMETRY_TOPIC:vegawatt.telemetry.v1}
  ignite:
    addresses: ${IGNITE_ADDRESSES:localhost:10800}
  anomaly:
    breach-threshold: ${ANOMALY_BREACH_THRESHOLD:3}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:8000}
  mail:
    from: ${MAIL_FROM:no-reply@vegawatt.local}
  web:
    allowed-origin: ${FRONTEND_DEV_ORIGIN:http://localhost:5173}
  outbox:
    relay-interval-ms: 2000
  scheduling:
    snapshot-interval-seconds: ${SNAPSHOT_INTERVAL:60}
    telemetry-interval-seconds: ${TELEMETRY_INTERVAL:5}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
