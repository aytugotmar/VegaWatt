spring:
  application:
    name: vegawatt-core
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vegawatt}
    username: ${POSTGRES_USER:vegawatt}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      connection-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      modify-topic-configs: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: vegawatt-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

vegawatt:
  kafka:
    registration-topic: ${KAFKA_REGISTRATION_TOPIC:vegawatt.asset-registration.v1}
    telemetry-topic: ${KAFKA_TELEMETRY_TOPIC:vegawatt.telemetry.v1}
  ignite:
    addresses: ${IGNITE_ADDRESSES:localhost:10800}
  anomaly:
    breach-threshold: ${ANOMALY_BREACH_THRESHOLD:3}
    recovery-threshold: ${ANOMALY_RECOVERY_THRESHOLD:3}
    recovery-ratio: ${ANOMALY_RECOVERY_RATIO:0.90}
  standby-anomaly:
    threshold-multiplier: ${STANDBY_ANOMALY_THRESHOLD_MULTIPLIER:3}
    minimum-excess-watt: ${STANDBY_ANOMALY_MINIMUM_EXCESS_WATT:2}
    breach-threshold: ${STANDBY_ANOMALY_BREACH_THRESHOLD:3}
    recovery-threshold: ${STANDBY_ANOMALY_RECOVERY_THRESHOLD:3}
  telemetry-health:
    stale-after-seconds: ${TELEMETRY_STALE_AFTER_SECONDS:30}
    offline-after-seconds: ${TELEMETRY_OFFLINE_AFTER_SECONDS:120}
    sweep-interval-seconds: ${TELEMETRY_HEALTH_SWEEP_INTERVAL_SECONDS:15}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:8000}
    # Caps the whole apiKeys x modelsToTry fallback loop in AskInsightUseCase, not any single
    # call — without it a Gemini outage costs up to (keys * models * readTimeoutMs) before the
    # request falls back, which is the slowest possible response on exactly the request that's
    # already failing.
    overall-timeout-ms: ${GEMINI_OVERALL_TIMEOUT_MS:15000}
  mail:
    from: ${MAIL_FROM:no-reply@vegawatt.local}
  web:
    allowed-origin: ${FRONTEND_DEV_ORIGIN:http://localhost:5173}
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
  rate-limit:
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MINUTE:5}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
    refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:20}
    insight-per-minute: ${RATE_LIMIT_INSIGHT_PER_MINUTE:5}
  jwt:
    secret: ${JWT_SIGNING_SECRET:vegawatt-super-secret-jwt-key-change-in-production-32bytes!}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    force-password-reset: ${BOOTSTRAP_ADMIN_FORCE_PASSWORD_RESET:false}
  outbox:
    relay-interval-ms: 2000
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}
    # A Kafka outage is transient on the timescale of minutes; only an event stuck for this long
    # is worth dead-lettering for operator attention rather than just keeping retrying.
    dead-letter-after-hours: ${OUTBOX_DEAD_LETTER_AFTER_HOURS:24}
  notification:
    worker-interval-ms: ${NOTIFICATION_WORKER_INTERVAL_MS:2000}
    claim-lease-seconds: ${NOTIFICATION_CLAIM_LEASE_SECONDS:120}
    cooldown-minutes: ${NOTIFICATION_COOLDOWN_MINUTES:30}
  scheduling:
    snapshot-interval-seconds: ${SNAPSHOT_INTERVAL:60}
    telemetry-interval-seconds: ${TELEMETRY_INTERVAL:5}
  history:
    max-range-days: ${HISTORY_MAX_RANGE_DAYS:90}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
