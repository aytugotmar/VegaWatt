spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vegawatt_test
    username: postgres
    password: postgres
    hikari:
      connection-timeout: 120000
      idle-timeout: 900000
      maximum-pool-size: 15
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.postgresql: INFO
