spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vegawatt
    username: vegawatt
    password: vegawatt
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 180000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
  flyway:
    enabled: true
    baseline-on-migrate: true

# Off under tests: the schedulers would otherwise keep threads alive past Surefire's post-exit
# window and force-kill the fork JVM. Scheduler behaviour is covered by calling the worker methods
# directly, so nothing here needs the timers to fire.
vegawatt:
  background-jobs:
    enabled: false

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.postgresql: INFO
