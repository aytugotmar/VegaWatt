name: CI

# I run the whole test suite on every push and every pull request so a broken test is caught here
# rather than on someone's machine after a merge. The two Java services and the web app are built
# and tested independently, mirroring how they are laid out in the repo (there is no parent POM).
on:
  push:
  pull_request:

# A newer push to the same ref makes an in-flight run pointless, so cancel it and save the minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # Report both modules even if one fails; a red core should not hide a red sensors.
      fail-fast: false
      matrix:
        module: [vegawatt-core, vegawatt-telemetry-sensors]
    steps:
      - uses: actions/checkout@v4

      # JDK 17 on purpose, not "latest". Byte Buddy (via Mockito via Spring Boot 3.3.4) cannot read
      # Java 25 class files, so a newer JDK fails every Mockito test with a toolchain error that
      # looks nothing like a real failure. Pinning 17 keeps CI matching what the project builds on.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # vegawatt-core's integration tests boot the context against a Postgres and a Kafka broker
      # that Testcontainers starts, so they need a Docker daemon; the ubuntu runner provides one.
      # They skip cleanly where no Docker is present, so this same command is safe on the sensors
      # module, which has none. The tests need no secrets: Testcontainers supplies the
      # infrastructure and the Gemini and SMTP paths fall back or are mocked.
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn -B -ntp test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vegawatt-web
    steps:
      - uses: actions/checkout@v4

      # Node 20 to match vegawatt-web/.nvmrc. This matters: Node 22+ ships an experimental global
      # localStorage that shadows the one jsdom provides, which breaks the component tests that read
      # it. Pinning 20 keeps CI on the version the app is developed against.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vegawatt-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test
