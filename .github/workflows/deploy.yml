name: Deploy to Google Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to GCP VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Core JAR
        working-directory: vegawatt-core
        run: mvn -B package -DskipTests

      - name: Build Sensors JAR
        working-directory: vegawatt-telemetry-sensors
        run: mvn -B package -DskipTests

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vegawatt-web/package-lock.json

      - name: Build Web Dist
        working-directory: vegawatt-web
        run: |
          npm ci
          npm run build

      - name: Transfer built artifacts to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "vegawatt-core/target/*.jar,vegawatt-telemetry-sensors/target/*.jar,vegawatt-web/dist"
          target: "~/VegaWatt"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/VegaWatt
            git pull origin main
            docker compose up -d --build
            docker image prune -f
