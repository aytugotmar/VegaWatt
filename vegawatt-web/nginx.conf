server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's content-hashed bundles are safe to cache forever — a code change always produces a
    # new filename, so a stale cached copy can never be served for changed content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and the SPA fallback) must always be revalidated, otherwise a browser that
    # cached an old index.html keeps requesting old-hashed asset filenames that no longer exist
    # after a redeploy, and falls back to garbled content instead of the new page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
